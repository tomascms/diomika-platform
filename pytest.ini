[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directory structure
testpaths = tests e2e

# Minimum version
minversion = 7.0

# Output options
addopts =
    -v
    --strict-markers
    --tb=short

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (database, external services)
    e2e: End-to-end tests (full workflow)
    order_flow: Order creation and fulfillment tests
    payment_flow: Payment processing tests
    invoice_generation: Invoice generation tests
    notification: Email and Slack notification tests
    slow: Slow running tests (use -m "not slow" to skip)
    security: Security scanning tests
    audit: Audit trail and retention tests
    load: Load testing markers

# Async support
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Avisos próprios aparecem (antes --disable-warnings escondia-os); só se cala o de uma dependência.
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias:DeprecationWarning
# A cobertura está em backend-api/.coveragerc (o coverage não lê estas secções do pytest.ini, API-10).
