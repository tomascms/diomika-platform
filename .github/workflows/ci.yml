name: CI/CD Pipeline

# Cada passo falha a sério: antes estava tudo com `|| true`, incluindo os
# testes, por isso o CI nunca podia ficar vermelho.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Um push novo no mesmo ramo/PR cancela o run anterior (minutos grátis, DEVOPS-08).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API — testes e segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock

      - name: Dependências
        run: pip install -r requirements-dev.txt -c requirements.lock

      - name: Bandit (severidade e confiança altas)
        run: bandit -q -r backend-api -lll -iii -x backend-api/tests

      - name: Testes
        working-directory: backend-api
        # tests/conftest.py isola tudo (BD, Supabase, Redis, Sentry, email).
        # Cobertura real, sem contar os testes (backend-api/.coveragerc). O mínimo só sobe (62,9% a 2026-11-02; meta 80%).
        run: python -m pytest tests -q -p no:cacheprovider -o addopts="" --cov=. --cov-fail-under=62

  storefront:
    name: Loja — lint e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: npm ci

      # composition-field.test.mjs carrega o CompositionField.vue com o Vite do backoffice: precisa das dependências dele.
      - name: Dependências do backoffice (para os testes da loja)
        working-directory: backoffice-desktop
        run: npm ci --ignore-scripts

      - name: Lint
        run: |
          npx oxlint src functions
          npx eslint src functions

      - name: Testes (node --test)
        run: npm test

      - name: Build de produção
        env:
          VITE_API_BASE_URL: https://api.diomika.com
          VITE_IMAGE_TRANSFORM: "0"
        run: npm run build

      - name: e2e local (API simulada; nada sai de localhost)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:local

      - name: Sem secrets no bundle e CSP correcta
        working-directory: .
        run: |
          python deploy/verify_bundle_secrets.py
          python deploy/verify_csp.py

  backoffice:
    name: Backoffice — build da interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backoffice-desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backoffice-desktop/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Build
        run: npx vite build

      - name: Lint (mesma versão do oxlint da loja; erros falham, avisos não)
        run: npx --yes oxlint@1.60.0 src electron scripts

      - name: Testes (node --test)
        run: npm test

      - name: Sintaxe do processo principal e scripts (Electron)
        run: for f in electron/*.cjs scripts/*.cjs; do node --check "$f"; done

  vulnerabilities:
    name: Vulnerabilidades críticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy (dependências do repositório)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  docker:
    name: Imagem Docker da API
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Sem push: o Render constrói a imagem a partir do Dockerfile; aqui só se confirma que constrói.
      - name: Build local
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: diomika-api:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy (imagem; vulnerabilidades críticas com correcção disponível)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: diomika-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
