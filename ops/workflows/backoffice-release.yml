name: Backoffice Mac build

# Só à mão. Constrói o .dmg (o Windows constrói-se no PC) e guarda-o 1 dia como artefacto privado,
# para descarregar com `gh run download` e apagar logo. Nada é publicado: sem palavra-passe, o
# instalador é a chave de admin (ADMIN_DESKTOP_AUTOLOGIN). O macOS conta 10x nos minutos.
on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: backoffice-desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backoffice-desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Build installer
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_IDENTITY: "-"
          DIOMIKA_DESKTOP_GATE: ${{ secrets.DIOMIKA_DESKTOP_GATE }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: diomika-backoffice-mac
          path: backoffice-desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 1
